# Claude (Sonnet) automated PR review.
#
# Runs on every PR opened or updated by the repo owner or collaborators.
# Fork PRs and external contributors are deliberately excluded: this is a
# public repo, and the job spends Anthropic API credits — the
# author_association guard keeps drive-by PRs from triggering it.
# Uses `pull_request` (not pull_request_target) so no elevated token or
# secrets are exposed to untrusted code.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN repository secret — a subscription token
# minted with `claude setup-token` (Claude Pro/Max account); reviews bill
# against the subscription and draw from its rate limits.  To rotate:
# run `claude setup-token` again and update the secret with
# `gh secret set CLAUDE_CODE_OAUTH_TOKEN`.  Requires the Claude GitHub
# App (github.com/apps/claude) installed on the repo.

name: Claude PR Review

permissions:
  contents: read
  pull-requests: write
  # Required by claude-code-action's OAuth-token auth (OIDC exchange).
  id-token: write

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: |
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      github.event.pull_request.author_association == 'MEMBER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        # The assert step below is the real gate (verdict comment posted or
        # the check fails); don't let an action-level refusal (e.g. on PRs
        # that edit this workflow) hard-fail before the assert's exemption
        # can apply.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # One top-level review comment that updates in place on every push
          # instead of stacking a new comment per commit.
          use_sticky_comment: true
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}
            in this repository.  The checkout is a detached merge commit,
            so `gh` cannot infer the PR number — always pass it explicitly
            (e.g. `gh pr diff ${{ github.event.pull_request.number }}`,
            `gh pr comment ${{ github.event.pull_request.number }} --body ...`).
            Do NOT run `gh pr list`, `gh api`, or `gh search` to discover it;
            those are not permitted and the number is already given above.

            Review this pull request. This repo is a clean-room Linux kernel
            block driver (rcraid) for AMD RaidXpert2 NVMe RAID arrays, so
            review with kernel-driver standards in mind:

            - Correctness in the I/O path: blk-mq request lifecycle
              (start/end exactly once), scatterlist sizing and DMA
              map/unmap pairing, NVMe PRP page-alignment rules, stripe
              arithmetic, integer overflow on sector/byte math.
            - Concurrency: locking around shared state, ISR vs process
              context, per-hctx vs global resources, completion races.
            - Error paths: every failure path must unwind (unmap, free,
              end request) and LOG — silent BLK_STS_IOERR returns have
              bitten this project before.
            - Assumptions that only hold for page-aligned direct I/O but
              break on fragmented buffered writeback (512-byte buffer-head
              bvecs) — this exact class of bug caused data-path failures
              in the past (see PR #10).
            - For shell scripts: safety of destructive operations, unset
              variable handling, quoting.

            Post findings as inline comments on the specific lines.
            Include severity (critical/major/minor) and a suggested fix
            where possible. Report real issues only — do not pad the
            review with style nits or restate the diff.

            MANDATORY FINAL STEP — do this as the very last thing, in
            every case, before you finish: post exactly one summary PR
            comment with
            `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
            State what you reviewed and then EITHER a short list of the
            issues you filed as inline comments, OR — if you found nothing
            — that it looks clean and is good to merge.  End the comment
            with a sign-off line, exactly one of:
              "✅ Approved" — no significant issues, good to merge, or
              "⚠️ Issues found" — there are findings to address.
            The CI gate greps for that sign-off — a review without it
            fails the check.  Do NOT end the review without posting this
            summary comment: a run that posts nothing is indistinguishable
            from a review that never ran, and a clean pass with no comment
            cannot be told apart from a failure. If a tool call is denied,
            do not retry it in a loop — skip it and proceed to this
            summary.
          # --allowedTools REPLACES the action's default allowlist, it does
          # not extend it.  So this list must cover BOTH what the reviewer
          # needs to read the change (Read/Grep/Glob, git/gh inspection) AND
          # what it needs to publish (gh pr comment for the summary, the
          # inline-comment MCP tool for line findings).  Omit the read tools
          # and the reviewer silently fails — permission_denials in the run
          # log, "No buffered inline comments", nothing posted.
          #
          # The read-only shell inspection tools (cat/sed/awk/grep/head/tail/
          # ls/wc/find/shellcheck/git blame) are included because a thorough
          # review reaches for them; without them the agent burns its turn
          # budget on denials and never posts its verdict — even a clean pass.
          # All are read-only; the guard above still restricts this job to
          # OWNER/COLLABORATOR/MEMBER PRs on a non-elevated token.
          claude_args: |
            --model claude-sonnet-5
            # 80: large driver PRs (e.g. the #51 RAID1 stack) exhaust 40
            # turns before the mandatory verdict comment gets posted.
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(cat:*),Bash(sed:*),Bash(awk:*),Bash(grep:*),Bash(rg:*),Bash(head:*),Bash(tail:*),Bash(ls:*),Bash(wc:*),Bash(find:*),Bash(shellcheck:*),mcp__github_inline_comment__create_inline_comment"

      # Ported from AlpacaBridge (open-astro): the action exits 0 even when
      # the agent never manages to post its verdict, so a green check could
      # exist with no review anywhere.  The verdict comment IS the artifact —
      # a run that produced no fresh bot comment ending in the sign-off line
      # must fail the check.
      - name: Assert the review verdict posted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A PR that modifies this very workflow can make the action refuse
          # to run — such PRs are reviewed by eye; don't leave them
          # permanently red.
          if gh pr diff "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" --name-only \
              | grep -qx ".github/workflows/claude-pr-review.yml"; then
            echo "::warning::This PR modifies the review workflow — passing without a verdict. Review it by eye."
            exit 0
          fi
          # Only the BOT's comments count, and only ones touched during THIS
          # run — a human writing "Approved" in discussion, or a sticky
          # comment left over from a previous commit's review, must not
          # satisfy the gate.
          started="$(gh run view "$GITHUB_RUN_ID" --repo "${{ github.repository }}" --json createdAt --jq .createdAt)"
          if gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate \
              | jq -r --arg since "$started" \
              '.[] | select(.user.login | test("^(claude|github-actions)(\\[bot\\])?$")) | select(.updated_at >= $since) | .body' \
              | grep -qE "✅ Approved|⚠️ Issues found"; then
            echo "Review verdict found."
          else
            echo "::error::The review agent finished without posting its verdict comment — failing rather than green-lighting a review that does not exist."
            exit 1
          fi
